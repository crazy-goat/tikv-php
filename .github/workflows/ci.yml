name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-actor:
    name: Check actor permissions
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check if actor is owner or collaborator
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor;
            const owner = context.repo.owner;

            if (actor === owner || actor === 'dependabot[bot]') {
              core.setOutput('allowed', 'true');
              return;
            }

            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              const level = data.permission;
              const allowed = ['admin', 'maintain', 'write'].includes(level);
              core.setOutput('allowed', allowed ? 'true' : 'false');
              if (!allowed) {
                core.warning(`Actor "${actor}" has permission "${level}" — skipping CI.`);
              }
            } catch (e) {
              core.setOutput('allowed', 'false');
              core.warning(`Could not determine permissions for "${actor}": ${e.message}`);
            }

  changes:
    name: Changes
    uses: crazy-goat/.github/.github/workflows/changes.yml@main

  docs:
    name: Docs
    uses: crazy-goat/.github/.github/workflows/docs-check.yml@main

  lint:
    name: Lint (PHPCS + Rector + PHPStan)
    needs: [check-actor, changes]
    if: needs.check-actor.outputs.allowed == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: grpc
          coverage: none
        env:
          COMPOSER_PROCESS_TIMEOUT: 0

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPCS
        run: composer cs

      - name: Run Rector (dry-run)
        run: composer rector

      - name: Run PHPStan
        run: composer phpstan

  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    needs: [check-actor, changes, lint]
    if: needs.check-actor.outputs.allowed == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Note: grpc extension not needed for unit tests (we mock gRPC calls)
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests
        run: ./vendor/bin/phpunit --testsuite Unit --testdox --fail-on-skipped --no-coverage
        timeout-minutes: 5

  grpc-unit-tests:
    name: gRPC Unit Tests (PHP 8.4)
    needs: [check-actor, changes, lint]
    if: needs.check-actor.outputs.allowed == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: grpc
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run gRPC unit tests
        run: ./vendor/bin/phpunit --testsuite Grpc --testdox --fail-on-skipped --coverage-xml=coverage-xml
        timeout-minutes: 5

  integration-tests:
    name: Integration Tests (PHP 8.4)
    needs: [check-actor, changes, lint]
    if: needs.check-actor.outputs.allowed == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: grpc
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run integration tests
        run: ./vendor/bin/phpunit --testsuite Integration --testdox --fail-on-skipped --no-coverage
        timeout-minutes: 5

  e2e-tests:
    name: E2E Tests
    needs: [check-actor, changes, lint]
    if: needs.check-actor.outputs.allowed == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      #
      # RawKV E2E tests (V1ttl mode with enable-ttl)
      #
      - name: Start TiKV cluster (V1ttl)
        run: |
          docker compose up -d tikv1 tikv2 tikv3
          echo "=== docker compose ps ==="
          docker compose ps

      - name: Wait for PD health (V1ttl)
        run: |
          echo "Waiting for PD to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:2379/pd/api/v1/health > /dev/null 2>&1; then
              echo "PD is healthy!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timeout waiting for PD"
              docker compose ps
              exit 1
            fi
            sleep 2
          done

      - name: Wait for TiKV stores (V1ttl)
        run: |
          echo "Waiting for TiKV stores to register with PD (up to 5 min)..."
          for i in $(seq 1 150); do
            RESP=$(curl -s http://localhost:2379/pd/api/v1/stores 2>/dev/null || echo "")
            STORE_COUNT=$(echo "$RESP" | jq -r '.stores | length // 0' 2>/dev/null || echo "0")
            if [ "$STORE_COUNT" -ge 3 ] 2>/dev/null; then
              echo "All 3 TiKV stores registered!"
              break
            fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "[$i/150] Stores: $STORE_COUNT"
              echo "tikv1 last log:"
              docker compose logs --tail 3 tikv1 2>&1 || true
            fi
            if [ "$i" -eq 150 ]; then
              echo "Timeout waiting for stores (count=$STORE_COUNT)"
              docker compose ps
              echo "=== tikv1 logs ==="
              docker compose logs tikv1 2>&1 | tail -30 || true
              echo "=== tikv2 logs ==="
              docker compose logs tikv2 2>&1 | tail -10 || true
              exit 1
            fi
            sleep 2
          done

      - name: Install dependencies
        run: docker compose run --rm php-client composer install --no-interaction --prefer-dist --no-progress

      - name: Run RawKV E2E tests
        run: |
          docker compose run --rm \
            -e PD_ENDPOINTS=pd:2379 \
            php-client vendor/bin/phpunit --testsuite E2E-RawKV --testdox --no-coverage
        timeout-minutes: 10

      - name: Cleanup V1ttl cluster
        if: always()
        run: docker compose down -v --remove-orphans

      #
      # TxnKV E2E tests (V1 mode without enable-ttl)
      #
      - name: Start TiKV cluster (V1)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.txnkv.yml up -d tikv1 tikv2 tikv3
          echo "=== docker compose ps ==="
          docker compose ps

      - name: Wait for PD health (V1)
        run: |
          echo "Waiting for PD to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:2379/pd/api/v1/health > /dev/null 2>&1; then
              echo "PD is healthy!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timeout waiting for PD"
              docker compose ps
              exit 1
            fi
            sleep 2
          done

      - name: Wait for TiKV stores (V1)
        run: |
          echo "Waiting for TiKV stores to register with PD (up to 5 min)..."
          for i in $(seq 1 150); do
            RESP=$(curl -s http://localhost:2379/pd/api/v1/stores 2>/dev/null || echo "")
            STORE_COUNT=$(echo "$RESP" | jq -r '.stores | length // 0' 2>/dev/null || echo "0")
            if [ "$STORE_COUNT" -ge 3 ] 2>/dev/null; then
              echo "All 3 TiKV stores registered!"
              break
            fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "[$i/150] Stores: $STORE_COUNT"
              echo "tikv1 last log:"
              docker compose logs --tail 3 tikv1 2>&1 || true
            fi
            if [ "$i" -eq 150 ]; then
              echo "Timeout waiting for stores (count=$STORE_COUNT)"
              docker compose ps
              echo "=== tikv1 logs ==="
              docker compose logs tikv1 2>&1 | tail -30 || true
              echo "=== tikv2 logs ==="
              docker compose logs tikv2 2>&1 | tail -10 || true
              exit 1
            fi
            sleep 2
          done

      - name: Run TxnKV E2E tests
        run: |
          docker compose run --rm --no-deps \
            -e PD_ENDPOINTS=pd:2379 \
            php-client vendor/bin/phpunit --testsuite E2E-TxnKV --testdox --no-coverage
        timeout-minutes: 10

      - name: Cleanup V1 cluster
        if: always()
        run: docker compose down -v --remove-orphans

  # API V2 needs a cluster whose TiKV nodes run with storage.api-version = 2,
  # so it gets its own job instead of tearing the V1 cluster down and back up.
  e2e-tests-apiv2:
    name: E2E Tests (API V2)
    needs: [check-actor, changes, lint]
    if: needs.check-actor.outputs.allowed == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose -f docker-compose.yml -f docker-compose.apiv2.yml build

      - name: Run API V2 E2E tests
        run: ./scripts/test-e2e-apiv2.sh
        timeout-minutes: 15

  # The single required check. Documentation-only changes skip the heavy jobs
  # (skipped is fine); code changes need every heavy job to succeed.
  ci-ok:
    name: ci-ok
    needs: [check-actor, changes, docs, lint, unit-tests, grpc-unit-tests, integration-tests, e2e-tests, e2e-tests-apiv2]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Code changes: $CODE"
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
          # Documentation-only changes skip the heavy jobs; code changes need all of them.
          if [ "$CODE" = "true" ]; then
            for r in $RESULTS; do
              [ "$r" = "success" ] || exit 1
            done
          fi
